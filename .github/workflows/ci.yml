name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label for the model-tests job. The default GitHub macos-14
          runner has 7 GB of memory and no persistent model cache, so use a
          self-hosted Apple Silicon runner or a large macOS runner.
        required: false
        default: macos-14
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # arm64 macOS runner. The MLX engine extras (stt, tts) are not installed
    # here: lint, types and unit tests run against the fake engines only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Install ffmpeg
        # The API decode and mp3/opus tests need it; they skip if it is absent.
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  menubar:
    # The macOS menu bar app in menubar/: a Swift 6 package. macos-15 ships
    # Xcode 16, the first with Swift 6. No signing here; see
    # menubar/Scripts/SIGNING.md. The bundle step reuses the release build
    # (incremental, nothing recompiles).
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle
        run: Scripts/bundle.sh

  model-tests:
    # Manual only. Installs the real MLX engines and runs the tests marked
    # `model`, which download weights from Hugging Face and need Metal.
    # Needs a self-hosted Apple Silicon runner or a large macOS runner with
    # enough memory; the default macos-14 runner is too small, so this job is
    # allowed to fail and never blocks a merge.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'macos-14' }}
    continue-on-error: true
    timeout-minutes: 60
    env:
      VOICED_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install system dependencies
        run: brew install espeak-ng ffmpeg
      - name: Install with engines
        run: uv sync --group dev --extra stt --extra tts
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Model tests
        run: uv run pytest -m model -q
