name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label for the model-tests job. The default GitHub macos-14
          runner has 7 GB of memory and no persistent model cache, so use a
          self-hosted Apple Silicon runner or a large macOS runner.
        required: false
        default: macos-14
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    # Lints the workflows and the Dependabot config: actionlint (with the
    # runner's shellcheck for run: scripts) from its release binary, checked
    # against a pinned sha256, and zizmor from its digest-pinned image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  check:
    # arm64 macOS runner. The MLX engine extras (stt, tts) are not installed
    # here: lint, types and unit tests run against the fake engines only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  menubar:
    # The macOS menu bar app in menubar/: a Swift 6 package. macos-15 ships
    # Xcode 16, the first with Swift 6. No signing here; see
    # menubar/Scripts/SIGNING.md. The bundle step reuses the release build
    # (incremental, nothing recompiles).
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle
        run: Scripts/bundle.sh

  model-tests:
    # Manual only. Installs the real MLX engines and runs the tests marked
    # `model`, which download weights from Hugging Face and need Metal.
    # Needs a self-hosted Apple Silicon runner or a large macOS runner with
    # enough memory; the default macos-14 runner is too small, so this job is
    # allowed to fail and never blocks a merge.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'macos-14' }}
    continue-on-error: true
    timeout-minutes: 60
    env:
      VOICED_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Install system dependencies
        run: brew install espeak-ng
      - name: Install with engines
        run: uv sync --group dev --extra stt --extra tts --extra moonshine
      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Model tests
        run: uv run pytest -m model -q
