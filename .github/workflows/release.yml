name: release

# Builds a release (ADR 0018, "Signing and release CI"): the voiced wheel and
# sdist, and voiced.app as a zip and a DMG, with sha256 sums. Pushing a `v*`
# tag also creates a draft GitHub release for it, which a person publishes,
# and leaves the Homebrew formula and cask for the tag as an artifact for the
# tap. `workflow_dispatch` is a dry run: the same build, uploaded as workflow
# artifacts only, never a release.
#
# The app is signed with the Developer ID and notarized only when the build
# runs for a tag and the signing secrets are there (menubar/Scripts/SIGNING.md
# names them; keep them as secrets of the `release` environment, which only
# `v*` tags may deploy to). Otherwise it is the ad hoc build bundle.sh makes,
# and the asset names and the job summary say so. There is no pull_request
# trigger, so a fork can never start this workflow against this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # The cheap checks first: the tag names pyproject's version, and the
    # CHANGELOG has a section for it, the release notes.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/release.py version)"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match version $version in pyproject.toml (expected v$version)"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-releases (1.0.0a1, 1.0.0rc1) and dev releases.
          if [[ "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          if ! python3 scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes/notes.md"; then
              if [ "$REF_TYPE" = tag ]; then
                  echo "::error::CHANGELOG.md has no section for $VERSION; move Unreleased under it before tagging"
                  exit 1
              fi
              echo "::warning::CHANGELOG.md has no section for $VERSION; the dry run uses Unreleased"
              python3 scripts/release.py notes Unreleased > "$RUNNER_TEMP/notes/notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  build:
    needs: prepare
    # macos-15 ships Xcode 16, the first with Swift 6 (as in ci.yml).
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    # The signing secrets live in this environment; only tag builds use it.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APP: menubar/build/voiced.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Output directory
        run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - name: Signing credentials
        # Only whether they are all there; nothing here prints a value.
        id: signing
        env:
          REF_TYPE: ${{ github.ref_type }}
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          signed=false
          reason="no Developer ID certificate, password and team ID in the secrets"
          if [ "$REF_TYPE" != tag ]; then
              reason="not a tag build"
          elif [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
              if [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
                  signed=true notary=api-key
              elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
                  signed=true notary=apple-id
              else
                  reason="no notary credentials in the secrets"
              fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notary=${notary:-}" >> "$GITHUB_OUTPUT"
          if [ "$signed" = true ]; then
              echo "Signing with the Developer ID, notarizing with the $notary credentials"
          else
              echo "::warning::Ad hoc build, not signed with a Developer ID or notarized: $reason"
          fi

      - name: Bundle
        run: menubar/Scripts/bundle.sh

      - name: Wheel and sdist
        # The wheel is the one in the bundle, so the release asset and what the
        # app installs are the same file. The sdist is built from the same
        # checkout with the bundle's uv and the hashed build backend.
        env:
          UV_NO_CONFIG: "1"
        run: |
          mkdir -p "$DIST"
          wheels=("$APP"/Contents/Resources/voiced-*.whl)
          wheel="$(basename "${wheels[0]}")"
          if [ "${#wheels[@]}" -ne 1 ] || [ "$wheel" != "voiced-$VERSION-py3-none-any.whl" ]; then
              echo "::error::the bundle carries ${wheels[*]}, expected voiced-$VERSION-py3-none-any.whl"
              exit 1
          fi
          cp "${wheels[0]}" "$DIST/"
          "$APP/Contents/Helpers/uv" build --sdist --python "$(tr -d '[:space:]' < menubar/app-python-version)" \
              --build-constraints src/voiced/build-requirements.lock --require-hashes --out-dir "$DIST" .
          [ -f "$DIST/voiced-$VERSION.tar.gz" ] || { echo "::error::no voiced-$VERSION.tar.gz was built"; exit 1; }

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        id: keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/voiced-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
              -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks the identity up in the search list: this keychain first.
          searched=()
          while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              searched+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          # The Developer ID Application identity of the team, by its SHA-1 hash.
          identity="$(security find-identity -v -p codesigning "$keychain" |
              awk -v team="($TEAM_ID)\"" '/"Developer ID Application: / && index($0, team) { print $2; exit }')"
          if [ -z "$identity" ]; then
              echo "::error::the certificate holds no Developer ID Application identity for the team"
              exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Notary credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY: ${{ steps.signing.outputs.notary }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          # The API key goes in a file only this job reads; the other kind is
          # passed to notarytool from the secrets, below.
          if [ "$NOTARY" = api-key ]; then
              umask 077
              mkdir -p "$RUNNER_TEMP/notary"
              # The .p8 as downloaded, or base64 encoded.
              if printf '%s' "$KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
                  printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/notary/AuthKey_$KEY_ID.p8"
              else
                  printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary/AuthKey_$KEY_ID.p8"
              fi
          fi

      - name: Sign, notarize and staple the app
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          NOTARY: ${{ steps.signing.outputs.notary }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # Hardened runtime and a secure timestamp, inside out: the bundled uv
          # first, then the app, which seals it. No entitlements: the app needs
          # none (SIGNING.md), and uv runs Python as a separate process.
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$@"; }
          sign "$APP/Contents/Helpers/uv"
          sign "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"

      - name: Package
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          # The ad hoc assets carry it in their name.
          if [ "$SIGNED" = true ]; then base="voiced-$VERSION-macos"; else base="voiced-$VERSION-macos-adhoc"; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$DIST/$base.zip"

          # The DMG: the app and a link to /Applications. hdiutil on hosted
          # runners sometimes fails with "Resource busy"; try again.
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging" && mkdir -p "$staging"
          ditto "$APP" "$staging/voiced.app"
          ln -s /Applications "$staging/Applications"
          for attempt in 1 2 3 4 5; do
              if hdiutil create -volname "voiced $VERSION" -srcfolder "$staging" -fs HFS+ \
                  -format UDZO -ov "$DIST/$base.dmg"; then
                  break
              fi
              [ "$attempt" -lt 5 ] || exit 1
              sleep $((attempt * 5))
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and staple the DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          DMG: ${{ runner.temp }}/dist/${{ steps.package.outputs.base }}.dmg
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          NOTARY: ${{ steps.signing.outputs.notary }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          .github/scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Remove the keychain and the API key
        if: always() && steps.signing.outputs.signed == 'true'
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/certificate.p12"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: Checksums
        run: |
          cd "$DIST"
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Summary
        if: always()
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          EVENT: ${{ github.event_name }}
        run: |
          {
              echo "## voiced $VERSION"
              echo
              if [ "$SIGNED" = true ]; then
                  echo "voiced.app is signed with the Developer ID, notarized and stapled."
              else
                  echo "> [!WARNING]"
                  echo "> **Ad hoc build.** voiced.app is not signed with a Developer ID and not notarized:"
                  echo "> Gatekeeper rejects it when it is downloaded. Its assets are named \`-adhoc\`."
              fi
              echo
              if [ "$EVENT" = workflow_dispatch ]; then
                  echo "Dry run: the files are this run's \`dist\` artifact; no release was created."
                  echo
              fi
              if [ -s "$DIST/SHA256SUMS" ]; then
                  echo '```'
                  cat "$DIST/SHA256SUMS"
                  echo '```'
              fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  homebrew:
    # The formula and the cask for the tag, for the owner to copy to the tap
    # (packaging/homebrew/README.md). Nothing is pushed anywhere.
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Formula and cask
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          out="$RUNNER_TEMP/homebrew"
          mkdir -p "$out/Formula" "$out/Casks"
          if [ "$SIGNED" = true ]; then zip="voiced-$VERSION-macos.zip"; adhoc=(); else zip="voiced-$VERSION-macos-adhoc.zip"; adhoc=(--adhoc); fi
          zip_sha256="$(cd "$RUNNER_TEMP/dist" && awk -v f="$zip" '$2 == f { print $1 }' SHA256SUMS)"
          [ -n "$zip_sha256" ] || { echo "::error::$zip is not in SHA256SUMS"; exit 1; }
          python3 scripts/release.py cask --version "$VERSION" --sha256 "$zip_sha256" "${adhoc[@]}" \
              > "$out/Casks/voiced.rb"

          # The formula builds from the tag's source archive, which GitHub
          # makes once the tag is pushed.
          if [ "$REF_TYPE" = tag ]; then
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$REF_NAME.tar.gz"
              curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/source.tar.gz" "$url"
              source_sha256="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d ' ' -f 1)"
              python3 scripts/release.py formula --url "$url" --sha256 "$source_sha256" > "$out/Formula/voiced.rb"
              formula="\`url\` $url, \`sha256\` $source_sha256"
          else
              formula="not generated: a dry run from a branch has no tag archive"
          fi
          {
              echo "## Homebrew"
              echo
              echo "- Formula: $formula"
              echo "- Cask: \`sha256\` $zip_sha256 for $zip"
              if [ "$SIGNED" != true ]; then
                  echo "- The cask points at the ad hoc build; do not copy it to the tap."
              fi
              echo
              echo "The files are this run's \`homebrew\` artifact; packaging/homebrew/README.md says how to update the tap."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew
          path: ${{ runner.temp }}/homebrew/
          if-no-files-found: error

  release:
    # The draft release for a pushed tag. The only job that can write.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      - name: Draft release
        run: |
          notes="$RUNNER_TEMP/notes/notes.md"
          if [ "$SIGNED" != true ]; then
              {
                  echo "> [!WARNING]"
                  echo "> This build of voiced.app is ad hoc signed, not signed with a Developer ID or notarized."
                  echo
                  cat "$RUNNER_TEMP/notes/notes.md"
              } > "$RUNNER_TEMP/notes.md"
              notes="$RUNNER_TEMP/notes.md"
          fi
          files=("$RUNNER_TEMP"/dist/*)
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)

          # A re-run updates the draft it made; a published release is never touched.
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
              if [ "$draft" != true ]; then
                  echo "::error::release $TAG is already published; not changing it"
                  exit 1
              fi
              keep=" $(printf '%s ' "${files[@]##*/}")"
              gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
                  case "$keep" in *" $asset "*) ;; *) gh release delete-asset "$TAG" "$asset" --yes ;; esac
              done
              gh release edit "$TAG" --title "voiced $VERSION" --notes-file "$notes" "${flags[@]}"
              gh release upload "$TAG" --clobber "${files[@]}"
          else
              gh release create "$TAG" --draft --verify-tag --title "voiced $VERSION" \
                  --notes-file "$notes" "${flags[@]}" "${files[@]}"
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
