name: dependency-locks

# Dependabot's uv pull requests change only pyproject.toml and uv.lock, so
# the files generated from uv.lock (the two shipped locks and NOTICE) say
# something else and CI fails. This workflow runs the command a contributor
# would, `uv run python scripts/refresh_locks.py`, on the Dependabot branch
# and pushes what it changed as one commit (CONTRIBUTING.md, "Updating a
# dependency"; ADR 0017, "One lock for all paths").
#
# No secrets. A Dependabot-triggered pull_request run gets a read-only token
# that the `permissions` key may raise, and `commit` raises it to push. The
# push uses that token, so GitHub starts the pull request's CI on the new
# commit only after someone with write access selects "Approve workflows to
# run" in the merge box. The commit message carries `[dependabot skip]`, so
# Dependabot still rebases the branch, and this runs again on its new commit.

on:
  pull_request:

permissions: {}

env:
  # uv.lock and every file scripts/refresh_locks.py writes, one per line: the
  # files `regenerate` uploads and `commit` copies. tests/test_dependency_locks.py
  # keeps it complete.
  GENERATED_FILES: |-
    uv.lock
    NOTICE
    src/voiced/requirements.lock
    src/voiced/build-requirements.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Runs the branch's code: `uv lock` and `uv run` may build a dependency
    # from its sdist. So this job holds only a read-only token, and the push
    # happens in `commit`, on another runner, from the files alone.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/uv/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv that wrote main's uv.lock, so `uv lock` here does not
          # rewrite it in another uv's style. Move it when uv.lock moves.
          version: "0.9.28"
      - name: Refresh
        id: refresh
        run: |
          uv run python scripts/refresh_locks.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: ${{ env.GENERATED_FILES }}
          if-no-files-found: error
          retention-days: 1

  commit:
    # Runs nothing from the branch: copies GENERATED_FILES over its checkout,
    # commits them and pushes. The push is not forced, so it fails if
    # Dependabot moved the branch meanwhile; its new commit runs this again.
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes; it runs no branch code and uploads nothing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - name: Commit and push
        env:
          GENERATED: ${{ runner.temp }}/generated
          BRANCH: ${{ github.head_ref }}
        run: |
          # GENERATED_FILES holds plain paths, one per line, so word splitting is safe.
          # shellcheck disable=SC2086
          set -- $GENERATED_FILES
          for f in "$@"; do cp "$GENERATED/$f" "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$@"
          git commit -m "chore(deps): regenerate the shipped locks and NOTICE [dependabot skip]"
          git push origin "HEAD:refs/heads/$BRANCH"
