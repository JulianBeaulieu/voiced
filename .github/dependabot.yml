version: 2
updates:
  # Weekly, so the SHA-pinned actions in the workflows get update pull
  # requests; a release must be a week old before it is proposed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # These pull requests change only pyproject.toml and uv.lock, and CI fails
  # until the files generated from uv.lock are rewritten on the branch:
  # `uv run python scripts/refresh_locks.py` (CONTRIBUTING.md, "Updating a
  # dependency").
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "httpx"]
      mlx:
        patterns: ["mlx*", "parakeet-mlx", "kokoro-onnx"]
