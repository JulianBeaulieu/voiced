[project]
name = "voiced"
version = "0.2.0"
description = "Local speech-to-text and text-to-speech server for Apple Silicon. OpenAI-compatible API and Wyoming protocol, runs as a launchd daemon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Beaulieu" }]
requires-python = ">=3.11,<3.14"
keywords = ["speech-to-text", "text-to-speech", "mlx", "apple-silicon", "home-assistant", "wyoming", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "wyoming>=1.6",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    # uvicorn's WebSocket backend; without it WebSocket routes (and the 403
    # for a handshake refused before accept) do not work.
    "websockets>=13",
    "zeroconf>=0.132",
    # Silero VAD as a ggml build: no torch, no onnxruntime, about 4.8 MB installed.
    "pysilero-vad>=3.4,<4",
    # Comment-preserving TOML writes for `voiced settings set` and the
    # control channel (ADR 0013). Pure Python, no dependencies.
    "tomlkit>=0.12",
    "imageio-ffmpeg>=0.6,<0.7",
]

[project.optional-dependencies]
# Real inference engines. Apple Silicon only; not installed in CI.
# mlx-audio, at the tts extra's range, runs Qwen3-ASR (ADR 0027), which relies on
# its internals: split_audio_into_chunks from mlx_audio.stt.models.qwen3_asr.qwen3_asr,
# generate(chunk_duration=inf, max_tokens=) and result.segments[0]["language"], and
# the aligner's get_supported_languages, items and aligner_processor.encode_timestamp.
# Nemotron (ADR 0025) relies on mlx-audio's nemotron_asr: load_model(lazy=True)
# returning a nemotron_asr.Model, set_dtype, the writable default_att_context_size,
# preprocessor_config.hop_length, prompt_kernel and prompt_dictionary,
# generate(language=, att_context_size=) and its result.sentences[].tokens[].start/end,
# create_streaming_session(language=) with feed, step(max_decode_tokens=), close and
# done, and the session's private _encoder.chunk_mel, _encoder.first_chunk_mel and
# _frontend.lookahead_samples. 0.5.9 is the first release with the English model's
# nemotron_asr_streaming loader and the first_chunk_mel its first piece is sized by.
# Whisper (ADR 0032) calls generate(language=, word_timestamps=) and reads
# result.language and result.segments[] start, end and text.
stt = ["parakeet-mlx>=0.5,<0.6", "mlx-audio>=0.5.9,<0.5.10"]
# mlx-audio is pinned to the releases the engines were checked against: Kokoro
# relies on its internals (load_voice_tensor, model(..., return_output=True),
# the residual blocks istftnet.AdainResBlk1d and AdaINResBlock1 it wraps for
# ADR 0019), and Soprano replaces its token loop (stream_generate) and reads private model
# attributes. Pocket TTS (ADR 0028) calls the private _run_flow_lm_and_increment_step
# and _slice_flow_cache and rewrites the config's flow_lm.lookup_table.tokenizer_path.
# Chatterbox Turbo (ADR 0029) reads the model's _conds, drives t3.inference_turbo_stream
# and s3gen.inference_stream, imports punc_norm and S3GEN_SIL, and replaces
# huggingface_hub.hf_hub_download while post_load_hook runs.
# OmniVoice (ADR 0030) calls the model's private _tokenize_style_and_text and
# _prepare_inference_inputs, generation.iterative_unmask by its keywords
# (cond_input_ids, cond_audio_mask, T, num_steps) and duration.RuleDurationEstimator.
# Marvis (ADR 0031) builds the sesame Model from its config (text_tokenizer
# rewritten), calls its private _tokenize_text_segment, _tokenize_audio,
# model.generate_frame, model.reset_caches and _streaming_decoder, and replaces
# hf_hub_download in mlx_audio.codec.models.mimi.mimi while the model is built.
# scipy (also an mlx-audio dependency) is declared because voiced.audio.resample uses
# it to take Soprano's 32 kHz output to 24 kHz; sentencepiece is Pocket TTS's
# tokenizer, which mlx-audio does not declare.
tts = [
    "mlx-audio>=0.5.9,<0.5.10",
    "kokoro-onnx>=0.4",
    "huggingface-hub>=1.1",
    "scipy>=1.11",
    "sentencepiece>=0.2,<0.3",
]
# Phonon on the CPU (ADR 0021): no MLX, so it installs on its own too. ptts is
# pinned to the minor release the engine was checked against (stream(),
# add_voice(), voice_catalog= and its default model and voice revisions).
phonon = ["ptts>=0.4,<0.5", "huggingface-hub>=1.1"]
# Moonshine on the CPU (ADR 0026): moonshine-voice bundles ONNX Runtime. Its only
# wheel is for macOS 15 and later (Darwin 24), so the marker lets a macOS 14
# install skip it; the engine then says so at load. Pinned to the release the
# engine was checked against: Stream.stop() completes the open line, and on a
# failed pass returns None and tells only the listeners; events carry .line or
# .error; create_stream(update_interval=); any streaming ModelArch loads any
# streaming folder through its streaming_config.json.
moonshine = [
    'moonshine-voice>=0.1.5,<0.2; sys_platform == "darwin" and platform_release >= "24"',
    "huggingface-hub>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "openai>=1.50",
    "types-psutil>=5.9",
    # voiced.models' download tests (snapshot_download with dry_run and a named bytes bar).
    "huggingface-hub>=1.1",
]
# The build backend, locked like everything else so that building voiced
# from a checkout (`voiced install --source`, the Homebrew formula) uses
# hashed build dependencies (ADR 0017). Keep in step with [build-system].
build = ["hatchling==1.32.4"]

[project.urls]
Homepage = "https://github.com/JulianBeaulieu/voiced"
Repository = "https://github.com/JulianBeaulieu/voiced"
Issues = "https://github.com/JulianBeaulieu/voiced/issues"

[project.scripts]
voiced = "voiced.entry:main"

# Engine plugins. Third-party packages add their own engines by declaring
# entry points in these two groups; see docs/decisions/0002-engine-interfaces.md.
[project.entry-points."voiced.stt_engines"]
fake = "voiced.testing.fakes:FakeSTTEngine"
parakeet = "voiced.engines.parakeet:ParakeetEngine"
qwen3-asr = "voiced.engines.qwen3_asr:Qwen3ASREngine"
moonshine = "voiced.engines.moonshine:MoonshineEngine"
nemotron = "voiced.engines.nemotron:NemotronEngine"
whisper = "voiced.engines.whisper:WhisperEngine"

[project.entry-points."voiced.tts_engines"]
fake = "voiced.testing.fakes:FakeTTSEngine"
kokoro = "voiced.engines.kokoro:KokoroEngine"
soprano = "voiced.engines.soprano:SopranoEngine"
phonon = "voiced.engines.phonon:PhononEngine"
pocket = "voiced.engines.pocket:PocketEngine"
chatterbox = "voiced.engines.chatterbox:ChatterboxEngine"
omnivoice = "voiced.engines.omnivoice:OmniVoiceEngine"
marvis = "voiced.engines.marvis:MarvisEngine"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiced"]

# Hatchling reads only the root .gitignore; these are the menu bar app's build
# outputs, ignored by menubar/.gitignore, which would otherwise go in the sdist.
[tool.hatch.build.targets.sdist]
exclude = ["menubar/.build", "menubar/.swiftpm", "menubar/build", "menubar/*.xcodeproj"]

# `voiced install` copies this into ~/.config/voiced/config.toml on first run.
[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "voiced/config.example.toml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/voiced", "scripts"]
mypy_path = "src"
warn_unreachable = true

# torch.*: scripts/utmos_score.py, which runs in its own uv environment (ADR 0024).
[[tool.mypy.overrides]]
module = ["wyoming.*", "parakeet_mlx.*", "mlx_audio.*", "kokoro_onnx.*", "espeakng_loader.*", "mlx.*", "huggingface_hub.*", "scipy.*", "imageio_ffmpeg.*", "ptts.*", "torch.*", "moonshine_voice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:voiced.*"]
markers = [
    "model: needs real model weights and Metal; skipped unless VOICED_MODEL_TESTS=1",
]
