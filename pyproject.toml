[project]
name = "voiced"
version = "0.0.1"
description = "Local speech-to-text and text-to-speech server for Apple Silicon. OpenAI-compatible API and Wyoming protocol, runs as a launchd daemon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Beaulieu" }]
requires-python = ">=3.11,<3.14"
keywords = ["speech-to-text", "text-to-speech", "mlx", "apple-silicon", "home-assistant", "wyoming", "openai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "wyoming>=1.6",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    # uvicorn's WebSocket backend; without it WebSocket routes (and the 403
    # for a handshake refused before accept) do not work.
    "websockets>=13",
    "zeroconf>=0.132",
    # Silero VAD as a ggml build: no torch, no onnxruntime, about 4.8 MB installed.
    "pysilero-vad>=3.4,<4",
    # Comment-preserving TOML writes for `voiced settings set` and the
    # control channel (ADR 0013). Pure Python, no dependencies.
    "tomlkit>=0.12",
]

[project.optional-dependencies]
# Real inference engines. Apple Silicon only; not installed in CI.
stt = ["parakeet-mlx>=0.5,<0.6"]
# mlx-audio is pinned to the releases the engines were checked against: Kokoro
# relies on its internals (load_voice_tensor, model(..., return_output=True)),
# and Soprano replaces its token loop (stream_generate) and reads private model
# attributes. scipy (also an mlx-audio dependency) is declared because
# voiced.audio.resample uses it to take Soprano's 32 kHz output to 24 kHz.
tts = ["mlx-audio>=0.5.8,<0.5.10", "kokoro-onnx>=0.4", "huggingface-hub>=0.23", "scipy>=1.11"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "openai>=1.50",
    "types-psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/JulianBeaulieu/voiced"
Repository = "https://github.com/JulianBeaulieu/voiced"
Issues = "https://github.com/JulianBeaulieu/voiced/issues"

[project.scripts]
voiced = "voiced.entry:main"

# Engine plugins. Third-party packages add their own engines by declaring
# entry points in these two groups; see docs/decisions/0002-engine-interfaces.md.
[project.entry-points."voiced.stt_engines"]
fake = "voiced.testing.fakes:FakeSTTEngine"
parakeet = "voiced.engines.parakeet:ParakeetEngine"

[project.entry-points."voiced.tts_engines"]
fake = "voiced.testing.fakes:FakeTTSEngine"
kokoro = "voiced.engines.kokoro:KokoroEngine"
soprano = "voiced.engines.soprano:SopranoEngine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiced"]

# `voiced install` copies this into ~/.config/voiced/config.toml on first run.
[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "voiced/config.example.toml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/voiced", "scripts"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["wyoming.*", "parakeet_mlx.*", "mlx_audio.*", "kokoro_onnx.*", "mlx.*", "huggingface_hub.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:voiced.*"]
markers = [
    "model: needs real model weights and Metal; skipped unless VOICED_MODEL_TESTS=1",
]
