# voiced configuration. Copy to ~/.config/voiced/config.toml and edit.
#
# Every key can also be set with an environment variable. The name is
# VOICED_<SECTION>__<KEY> in upper case, for example:
#   VOICED_SERVER__BIND=0.0.0.0
#   VOICED_TTS__DEFAULT_VOICE=bf_emma
#   VOICED_STT__LANGUAGES='["en"]'   (lists are JSON)
# Environment variables take precedence over this file.
# All values below are the defaults.

[server]
# Address both services listen on. 127.0.0.1 is local-only. Set to 0.0.0.0 to
# serve your LAN; the HTTP API then has no authentication unless api_key is set,
# and the Wyoming protocol has none at all, so only do this on a trusted network.
bind = "127.0.0.1"

# Optional bearer token for the HTTP API. Empty disables authentication.
# Wyoming has no authentication in the protocol and is not affected.
api_key = ""

# Where the services write their logs.
log_dir = "~/Library/Logs/voiced"

# debug, info, warning, error
log_level = "info"

# Advertise the Wyoming listeners on the local network (mDNS, service type
# _wyoming._tcp.local.) so Home Assistant offers to add them automatically.
# Only active when bind is not a loopback address: a listener on 127.0.0.1 is
# unreachable from other machines, so there is nothing worth announcing.
zeroconf = true

# Show a settings form on each service's status page (http://<host>:8880/).
# Off by default. When on, the form always needs api_key: with no key set it
# is refused, even on loopback, since any web page you open can reach a
# loopback port. The menu bar app and `voiced settings` use the local control
# socket instead and do not need this.
browser_settings = false

# While a streaming client holds the inference slot (Wyoming STT, the
# WebSocket stream), drop it after this many seconds without input, and drop
# any client that does not accept a write within write_timeout_s. Otherwise a
# half-open connection keeps the GPU busy for everyone else. A streamed
# utterance may stay open for its audio limit (see max_upload_mb) plus
# session_idle_s, and a Wyoming client that starts an event must finish
# sending it within session_idle_s.
session_idle_s = 30
write_timeout_s = 10

[stt]
# OpenAI-compatible HTTP API for transcription.
http_port = 8881
# Wyoming protocol listener used by Home Assistant.
wyoming_port = 10300
# Engine plugin name (see `voiced doctor` for the installed list).
engine = "parakeet"
model = "mlx-community/parakeet-tdt-0.6b-v3"
# Languages advertised to clients. Must be a subset of what the engine supports.
languages = ["en"]
# Silence window for server-side end-of-speech detection. Reserved: no
# transport ends an utterance on it yet, so changing it has no effect.
vad_silence_ms = 200
# Requests waiting for the GPU beyond this number get HTTP 503. It also caps
# how many uploads are decoded at once (more get 503 too).
queue_depth = 8
# Live streams (Wyoming, WebSocket) transcribed at once. Setting it above
# queue_depth is an error, and the service opens no more than the engine can
# interleave (its max_streams: 6 for parakeet, 1 for an engine that declares
# nothing). The next one waits for one of them to end; its client's audio is
# held meanwhile. More than the measured default and every stream's final
# transcript is later (docs/decisions/0020-concurrent-stt-streams.md).
streams = 3
# Largest upload accepted by /v1/audio/transcriptions. Also caps the audio an
# upload decodes to, one WebSocket stream and one Wyoming utterance at the same
# amount of 16-bit 16 kHz audio (about 26 minutes at 50).
max_upload_mb = 50

[tts]
http_port = 8880
wyoming_port = 10200
engine = "kokoro"
model = "mlx-community/Kokoro-82M-bf16"
default_voice = "af_heart"
languages = ["en"]
# Default playback speed multiplier.
speed = 1.0
queue_depth = 8
# Longest text accepted by one /v1/audio/speech request, in characters.
max_input_chars = 4096
# espeak-ng for Kokoro: a libespeak-ng.dylib, and optionally its data
# directory, instead of the one found automatically. The tts service sets
# VOICED_ESPEAK_LIBRARY and VOICED_ESPEAK_DATA from these.
# espeak_library = "/opt/homebrew/opt/espeak-ng/lib/libespeak-ng.dylib"
# espeak_data = "/opt/homebrew/opt/espeak-ng/share/espeak-ng-data"

[launchd]
# Reverse-DNS prefix of the launchd labels that status, start, stop, restart,
# doctor and the watchdog address: <prefix>.stt, <prefix>.tts and
# <prefix>.watchdog. The root step installs the default labels only; change
# this only for daemons installed some other way.
label_prefix = "io.github.julianbeaulieu.voiced"

[watchdog]
# How often the watchdog polls each service's /health.
interval_s = 15
# Consecutive failed polls before the service is restarted.
failures_before_restart = 3
# Timeout for each /health request.
timeout_s = 5
# Model-load allowance. For this long after the watchdog starts, after it
# restarts a service, or after launchd gives a service a new pid, refused
# connections are treated as "still loading", not as failures. A service that
# answers "starting" for longer than this (by its own uptime) is restarted.
startup_grace_s = 300
# A service that stays "degraded" (last inference failed) for longer than this
# is restarted.
degraded_window_s = 120
# Never restart the same service twice within this many seconds.
restart_cooldown_s = 120
# A service whose queue is not empty but has not completed an inference for
# this long is treated as hung and restarted.
stall_after_s = 60
# Also send a tiny inference request each poll (only while the queue is empty)
# and treat a timeout as a hang. Off by default.
probe = false
# How long the probe request may take before it counts as a hang.
probe_timeout_s = 20

[install]
# The state directory: bin/voiced (the program the daemons run, a link to
# the active environment), the environments `voiced install --source` builds,
# install.json and the control socket. The name is historical; it is not
# necessarily a virtual environment (ADR 0017).
venv_dir = "~/.voiced"
# Python version for environments `voiced install --source` builds, like
# "3.12"; uv downloads it into <venv_dir>/python. Empty means 3.12.
python = ""
# Hugging Face cache directory for model downloads. Leave unset to use the
# Hugging Face default (~/.cache/huggingface). voiced sets HF_HOME from it
# and ignores one exported in your shell. Absolute, or starting with ~.
# hf_home = "~/.cache/huggingface"
